<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#1e446e" />
    </linearGradient>
  </defs>
  
  <!-- Bus Icon Container -->
  <g transform="translate(15, 10)">
    <!-- Motion lines -->
    <path d="M 5 35 L 22 35" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 0 50 L 18 50" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
    <path d="M 8 65 L 24 65" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    
    <!-- Modern Bus Body -->
    <rect x="25" y="15" width="70" height="60" rx="14" fill="url(#busGrad)" />
    
    <!-- Windshield & Windows -->
    <path d="M 33 25 L 87 25 C 91 25 93 27 93 31 L 93 42 L 33 42 Z" fill="#ffffff" opacity="0.95" />
    <!-- Window divider -->
    <rect x="62" y="25" width="3" height="17" fill="#f97316" opacity="0.8" />
    
    <!-- Headlight -->
    <circle cx="89" cy="55" r="4" fill="#fef08a" />
    
    <!-- Wheels -->
    <circle cx="45" cy="75" r="10" fill="#0f2744" />
    <circle cx="45" cy="75" r="4.5" fill="#ffffff" />
    <circle cx="75" cy="75" r="10" fill="#0f2744" />
    <circle cx="75" cy="75" r="4.5" fill="#ffffff" />
    
    <!-- Fast track curve -->
    <path d="M 20 88 C 50 88 75 92 105 88" stroke="#0f2744" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="130" y="68" font-family="'Inter', system-ui, sans-serif" font-size="46" font-weight="900" fill="#0f2744" letter-spacing="-1">
    Safar<tspan fill="#f97316">Go</tspan>
  </text>
  
  <!-- Hindi Tagline -->
  <text x="132" y="94" font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="0.5">
    अब हर सफर होगा आसान
  </text>
  
  <!-- Verified Badge -->
  <g transform="translate(350, 42)">
    <rect x="0" y="0" width="98" height="24" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="49" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle">MANUAL PORTAL</text>
  </g>
</svg>
